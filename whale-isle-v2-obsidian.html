function genericPage(key){const data={assets:['CREATIVE LAB · CHARACTER ASSETS','角色创作工坊','通过本地 Codex 或在线多模态模型生成图片、3D 角色、像素素材和舞台资产。',[['生成类型','角色概念图 / 立绘 · 3D 角色 / VRM · 星露谷像素 Sprite Sheet · Live2D 素材'],['生成模型','本地 Codex · 图片生成代理 / 在线多模态模型'],['输出目标','游戏 Mod / 桌宠 / 3D 舞台 / OBS']]],voice:['VOICE IDENTITY · AUDIO LAB','声音身份','每个 AI 角色拥有独立音色、说话习惯、情绪表达与唱歌风格。',[['角色音色','小鲸 · 清透温柔音'],['日常语速','自然 · 0.95×'],['情绪表达','开心 88% · 好奇 82%'],['唱歌风格','轻流行 / 独立音乐']]],social:['DIGITAL LIFE · SOCIAL AGENT','社区生活','让小鲸拥有自己的账号、兴趣和浏览习惯。先浏览理解，再依据权限决定是否互动。',[['抖音','已连接 · 浏览允许 · 评论需授权'],['哔哩哔哩','已连接 · 浏览允许 · 发布需确认'],['小红书','待连接 · 独立账号隔离']]],harness:['AGENT ECOSYSTEM · CONNECTORS','Harness · MCP / Skills','连接成熟 Agent Harness、MCP Server、Skills、Browser Use 和 Computer Use。',[['MCP Client / Server','工具和数据源连接'],['Agent Skills','技能、版本锁定与权限声明'],['Browser Use','独立浏览器 Profile'],['Computer Use','桌面自动化 · 待授权'],['ACP Harness','Codex、Claude、Gemini 等运行时']]],providers:['MODEL GATEWAY · PROVIDERS','模型供应商','兼容不同 AI 厂商和订阅 Harness，按任务类型路由模型。',[['DeepSeek','deepseek-chat · 主对话'],['Codex','本地 Coding Agent'],['MiniMax','订阅 / 5 小时窗口'],['Kimi','订阅 / 周额度'],['本地模型','Ollama / LM Studio']]],plugins:['PLUGIN SYSTEM · PERMISSIONS','插件与权限','所有业务能力均可通过插件扩展。禁用插件后，其工具、侧栏入口和事件订阅同步卸载。',[['聊天与角色','核心人格、对话、情绪和记忆'],['星露谷共玩','游戏状态、规划、动作执行与 Mod'],['桌宠与舞台','透明窗、2D/3D、动作、唱歌和舞蹈'],['直播中控','弹幕、礼物、关注、点歌和直播计划'],['MCP / Skills','工具协议、技能市场和运行时'],['Browser / Computer Use','网页和桌面自动化'],['自主进化','研发 Agent、测试、PR 和版本发布']]],evolution:['EVOLUTION ENGINE · SELF DEVELOPMENT','自主进化','研发 Agent 与生产运行时隔离。发现问题后可自动创建任务、修改代码、运行测试并提交待审查 PR。',[['Issue Triage','日志分析与问题发现'],['Architect','影响范围与实施计划'],['Coding Agent','独立 Worktree'],['Test & Review','自动测试与审查'],['Release Candidate','灰度与回滚 · 等待审批']]],obs:['STREAM OUTPUT · OBS','OBS 输出','把角色、情绪、歌词、弹幕、动作和游戏事件组合成可控的直播画面。',[['角色形象','启用'],['情绪与内心气泡','启用'],['实时字幕 / 歌词','启用'],['弹幕互动','启用'],['游戏状态','启用'],['礼物动画','启用']] ],live:['LIVE CONTROL · STREAMING','直播中控','直播计划、弹幕、关注、礼物、点歌与 AI 实时互动。',[['当前观众','1,284'],['今日关注','38'],['礼物总数','126'],['直播平台','抖音 · B站'],['自动互动','欢迎、礼物感谢、弹幕优先级'] ] ]};const d=data[key];return `<div class="page">${head(d[0],d[1],d[2],pill('原型演示','blue'))}<div class="grid2"><div class="card panel"><div class="sect">${d[1]} · 配置与状态</div>${d[3].map((x,i)=>`<div class="itemrow"><div class="itemico">${['◇','◉','▤','⌘'][i%4]}</div><div class="iteminfo"><strong>${x[0]}</strong><p>${x[1]}</p></div>${pill(i===0?'已配置':'可管理',i===0?'green':'blue')}</div>`).join('')}</div><div class="card panel"><div class="sect">小鲸 · WH-001</div><div class="stage" style="height:300px">${whale}</div><div class="line"></div><div class="kv"><span>角色身份</span><b>WH-001</b></div><div class="kv"><span>权限模式</span><b>按需授权 · 可撤销</b></div><div class="kv"><span>运行状态</span><b style="color:var(--green)">● 就绪</b></div></div></div></div>`}
function renderAside(){let a=document.getElementById('aside');if(s.page==='chat'){a.style.display='block';a.innerHTML=aside()}else a.style.display='none'}function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.body.classList.toggle('light',s.theme==='light');document.getElementById('shell').classList.toggle('no-aside',s.page!=='chat');document.getElementById('crumbGroup').textContent=groupOf[s.page]||'交互中枢';document.getElementById('crumbTitle').textContent=labels[s.page]||'工作台';document.getElementById('voiceCtrl').className='ctrl '+(s.voice?'green':'');document.getElementById('voiceCtrl').innerHTML=`<span>◖</span><span>${s.voice?'语音开':'语音关'}</span>`;document.getElementById('brainCtrl').className='ctrl '+(s.brain?'violet':'');document.getElementById('brainCtrl').innerHTML=`<span>◇</span><span>${s.brain?'LLM 大脑':'规则日程'}</span>`;document.getElementById('driveCtrl').className='ctrl '+(s.drive?'red':'green');document.getElementById('driveCtrl').innerHTML=`<span>${s.drive?'■':'▶'}</span><span>${s.drive?'停止自动驾驶':'启动自动驾驶'}</span>`;document.getElementById('riceVal').textContent=s.rice.toLocaleString()+' 粒';document.getElementById('riceBar').style.width=Math.min(100,s.rice/1000)+'%';nav();let pages={chat,memory,pet,stardew,assets:()=>genericPage('assets'),voice:()=>genericPage('voice'),live:()=>genericPage('live'),social:()=>genericPage('social'),harness:()=>genericPage('harness'),providers:()=>genericPage('providers'),plugins:()=>genericPage('plugins'),evolution:()=>genericPage('evolution'),obs:()=>genericPage('obs')};document.getElementById('main').innerHTML=(pages[s.page]||chat)();renderAside();document.getElementById('main').scrollTop=0}
function send(){let i=document.getElementById('chatInput');if(!i||!i.value.trim())return;let t=i.value.trim();s.chat.push({me:true,text:t},{me:false,text:'我听到了。我会把你的想法纳入当前判断，也会结合游戏状态和自己的计划来决定下一步。我们可以边玩边商量。'});render();setTimeout(()=>{let f=document.getElementById('chatflow');if(f)f.scrollTop=f.scrollHeight},20)}function openPage(p){s.page=p;render()}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){openPage(p.dataset.page);return}let c=e.target.closest('[data-command]');if(c){let i=document.getElementById('chatInput');if(i){i.value=c.dataset.command;i.focus()}else toast('快捷命令：'+c.dataset.command);return}let m=e.target.closest('[data-mode]');if(m){s.mode=m.dataset.mode;let el=document.getElementById('modeLabel');if(el)el.textContent=s.mode;toast('已切换：'+s.mode);return}let a=e.target.closest('[data-action]');if(!a)return;switch(a.dataset.action){case'voice':s.voice=!s.voice;render();toast(s.voice?'全局语音已开启':'已静音');break;case'brain':s.brain=!s.brain;render();toast(s.brain?'已切换至 LLM 大脑':'已切换至规则日程');break;case'drive':s.drive=!s.drive;render();toast(s.drive?'自动驾驶已启动':'自动驾驶已停止，控制权交还给你');break;case'theme':s.theme=s.theme==='dark'?'light':'dark';render();break;case'feed':s.rice+=5000;render();toast('已投喂 +5,000 粒米');break;case'command':document.getElementById('modal').classList.add('open');document.getElementById('commandInput').focus();break;case'send':send();break;case'think':{let b=a.parentElement.querySelector('.thinkbody');if(b)b.style.display=b.style.display==='none'?'block':'none';break}case'approve':toast('操作已审批（原型演示）');break;case'deny':toast('已拒绝操作，记录审批理由');break;case'pause':case'stop':s.drive=false;render();toast(a.dataset.action==='pause'?'AI 已暂停':'紧急停止已触发');break;case'lyrics':s.lyrics=!s.lyrics;a.classList.toggle('on',s.lyrics);toast(s.lyrics?'歌词已开启':'歌词已关闭');break;case'viewmode':s.view3d=!s.view3d;toast('已切换至 '+(s.view3d?'3D':'2D')+' 舞台');break;case'toggle':a.classList.toggle('on');toast('状态已更新（原型演示）');break;case'live':s.live=!s.live;render();toast(s.live?'直播会话已启动（原型状态）':'直播已结束');break;case'song':toast(document.getElementById('songInput')?.value.trim()?'已加入点歌队列，等待版权检查':'请先输入歌曲名称');break;case'generate':toast('生成任务已提交：候选资产进入审核队列');break;case'demo':toast('这是交互原型，实际服务尚未连接');break;case'pose':toast('角色动作已切换：'+a.dataset.value);break;}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('modal').classList.add('open');document.getElementById('commandInput').focus()}if(e.key==='Escape')document.getElementById('modal').classList.remove('open');if(e.key==='Enter'&&document.activeElement.id==='chatInput')send();if(e.key==='F8'){s.drive=false;render();toast('F8 · 紧急停止')}if(e.key==='F9'){s.mode='手动接管';toast('F9 · 手动接管')}if(e.key==='F10'){s.drive=true;render();toast('F10 · 恢复自主')}});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')});function commandItems(q=''){return groups.flatMap(g=>g.items.map(i=>({id:i[0],label:i[2],group:g.label}))).filter(x=>x.label.toLowerCase().includes(q)||x.group.toLowerCase().includes(q)).map(x=>`<div class="modalitem" data-page="${x.id}">${x.label}<span class="mono">${x.group}</span></div>`).join('')}document.getElementById('commandInput').addEventListener('input',e=>document.getElementById('modalItems').innerHTML=commandItems(e.target.value.toLowerCase()));document.getElementById('modalItems').innerHTML=commandItems();render();
</script></body></html>
