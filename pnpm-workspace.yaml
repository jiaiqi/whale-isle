packages:
  # TS 业务包（shared-protocol / pet-renderer / model-gateway / persona-brain / game-bridge-mcp / live-stream-hub / local-store）
  - "packages/*"
  # Electron 宿主（desktop-host）
  - "apps/*"
  # Python 音频服务（audio-ai-worker）目录纳入工作区视野，但其本身用 uv 管理，无 package.json 时会被忽略
  - "services/*"
  # AI 自测沙盒（mock-harness）与脚本
  - "tools/*"
# 注意：mods/ 为 C# SMAPI Mod（dotnet 构建），不纳入 pnpm 工作区

# 允许运行安装脚本的依赖（原生模块/构建工具）
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  electron: true
  esbuild: true
