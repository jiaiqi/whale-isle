[mypy]
python_version = 3.11
strict = True
plugins = pydantic.mypy

# 生成物特例（T-M0-02）：datamodel-codegen 将枚举字段的 .default('X') 输出为字符串字面量，
# 与 Optional[StrEnum] 注解冲突（运行期由 Pydantic 正确强制转换，非类型缺陷）。
# 仅对 AUTO-GENERATED 的 protocol_models.py 豁免 assignment 一项；其余 strict 规则全部生效。
[mypy-protocol_models]
disable_error_code = assignment
