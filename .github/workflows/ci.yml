# CI —— 全量门禁与 Electron E2E 的最小可用编排（AGENTS.md §2.3 / §3.3）。
#
# 设计约束（刻意保持最小）：
#   · Node 22（与根 package.json engines.node >=22.5 一致；node:sqlite 需要 22.5+，
#     且 Node 22 的 Map.groupBy 可避免 vitest 在失败汇总时二次崩溃）；pnpm 12（本地与 lockfile v9 兼容）。
#   · 不注入任何 secrets；不跑真实游戏（星露谷/泰拉瑞亚/DST）、真实抖音直播间、真实模型 key。
#   · ubuntu：typecheck + dependency-cruiser + 单元测试（排除 Electron E2E）+ Python ruff/mypy/pytest。
#     Electron 二进制不下载（ELECTRON_SKIP_BINARY_DOWNLOAD=1），因此不跑宿主 E2E。
#   · macOS：构建 desktop-host 后跑完整 `pnpm verify:gate`（含 Gate 4 回环），
#     再单独跑 Electron UI E2E（[E2E-HOST]，仍需人类真机抽检 OS 级穿透/手感）。
#   · 缓存只用 setup-node 的 pnpm store 缓存与 setup-uv 缓存；超时按当前实测留出余量。
name: CI

on:
  push:
    branches: [main, feat/whale-isle-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: ubuntu · 类型/边界/单测/Python（Electron E2E 除外）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # ubuntu 不跑 Electron E2E，也不 require('electron')；Electron 45 的二进制是懒下载，
        # 本 job 不会触发（旧的 ELECTRON_SKIP_BINARY_DOWNLOAD 对其已无意义）。
        run: pnpm install --frozen-lockfile

      - name: Gate 1a · TypeScript 类型编译
        run: pnpm typecheck

      - name: Gate 1b · dependency-cruiser 架构边界
        run: pnpm lint:deps

      - name: 构建 WhaleIsleAvatar Mod（像素流水线测试的 DLL 前置）
        # publish/WhaleIsleAvatar.dll 不入库；dotnet 缺失时脚本如实告警退出 0，
        # 相关测试按 skipIf 如实跳过而非假绿（GitHub runner 自带 .NET SDK，正常会产出 DLL）。
        run: node tools/scripts/build-avatar-mod.mjs

      - name: Gate 3 · 单元/契约测试
        # vitest.config.mts 只包含 packages/apps/services 的 src/**/*.spec.ts；
        # Electron E2E 不在此步（macOS job 单独跑），ubuntu 无需 Electron。
        run: pnpm test

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Gate 1c · Python ruff + mypy --strict
        run: pnpm py:type

      - name: Gate 3b · Python pytest
        run: pnpm py:test

      - name: Gate 2c · DST Lua 语法（luac -p）
        # 覆盖 mods/dst-bridge；编译期语法校验不等于游戏内加载，真机验收仍在 VERIFY 右栏。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          find mods/dst-bridge -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p

      - name: Gate 2b · 依赖漏洞（阻断 high/critical）
        # T-M6-30：Electron 45 + Zod 4 后 high/critical 清零；继续阻断防止回退。
        run: pnpm audit --audit-level high

  macos:
    name: macOS · 完整 verify:gate + Electron E2E
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Warm Electron binary（Electron 45 懒下载）
        # Electron 45 取消 postinstall，首次 require('electron') 才下载二进制；显式预热便于
        # 把下载失败与 E2E 失败区分开。
        run: pnpm --filter @workbench/desktop-host exec node -e "console.log(require('electron'))"

      - name: Build desktop-host（Electron E2E 前置）
        run: pnpm --filter @workbench/desktop-host build

      - name: 构建 WhaleIsleAvatar Mod（像素流水线测试的 DLL 前置）
        # 同 ubuntu job：dotnet 缺失时如实告警退出 0，相关测试 skipIf 跳过
        run: node tools/scripts/build-avatar-mod.mjs

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Full gate · pnpm verify:gate
        # Gate 1/2/3/4 全跑；若 uv 缺失 Python 侧会 SKIP（这里已安装 uv，故要求真跑）。
        run: pnpm verify:gate

      - name: Electron E2E（[E2E-HOST]，仅 macOS）
        # 宿主 E2E 文件；Gate 4 回环已在 verify:gate 内跑过，避免重复。
        run: >
          pnpm exec vitest run --config vitest.e2e.config.mts
          apps/desktop-host/e2e/desktop.e2e.spec.ts
          apps/desktop-host/e2e/ui.e2e.spec.ts
          apps/desktop-host/e2e/tray-popover.e2e.spec.ts
          apps/desktop-host/e2e/pet-evolution.e2e.spec.ts
