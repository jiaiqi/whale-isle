<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<title>游戏共玩 — 鲸屿 Whale Isle</title>
<link rel="stylesheet" href="tokens.css">
<script src="../vendor/lucide.min.js"></script>
<script src="shell.js"></script>
<style>
  .page { max-width: 1280px; margin: 0 auto; padding: 18px 24px 48px; }

  /* 顶部游戏切换栏 */
  .game-head {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    flex-wrap: wrap; margin-bottom: 14px;
  }
  .game-head-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sub-tabs { display: inline-flex; gap: 6px; }
  .sub-tab {
    font-size: 11.5px; padding: 5px 12px; border-radius: 980px; border: 1px solid var(--stroke);
    background: var(--surface); color: var(--text-2); cursor: pointer;
    transition: all var(--dur-hover) var(--ease);
  }
  .sub-tab.on { border-color: var(--blue-line); background: var(--blue-dim); color: var(--blue); font-weight: 600; }

  /* 未连接引导横幅（解决空白满屏 "—" 痛点） */
  .conn-banner {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 13px 16px; border-radius: var(--r-xl); margin-bottom: 16px;
    border: 1px solid var(--amber-line); background: var(--amber-dim);
  }
  .conn-banner.ok { border-color: var(--green-line); background: var(--green-dim); }
  .conn-banner .title { font-size: 13px; font-weight: 650; display: flex; align-items: center; gap: 7px; }
  .conn-banner .steps { font-size: 11.5px; color: var(--text-2); margin-top: 3px; line-height: 1.65; }

  /* 三栏主布局（全语义变量，浅色主题零发灰） */
  .wrap { display: grid; grid-template-columns: 1.18fr 0.98fr 0.84fr; gap: 14px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .panel { padding: 15px 16px; border-radius: var(--r-xl); }
  .panel h4 { font-size: 12.5px; font-weight: 650; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }

  .now-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 11px; color: var(--text-2); }
  .now-name { font-size: 18px; font-weight: 700; font-family: var(--font-mono); color: var(--blue); }
  .now-desc { font-size: 12px; color: var(--text-2); margin: 4px 0 11px; line-height: 1.6; }
  .now-bar { height: 5px; border-radius: 999px; background: var(--inset); overflow: hidden; margin-bottom: 11px; }
  .now-bar i { display: block; height: 100%; border-radius: 999px; background: var(--green); transition: width .35s var(--ease-out); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat-box { padding: 8px 10px; border-radius: var(--r-md); background: var(--inset); border: 1px solid var(--stroke); }
  .stat-box .k2 { font-size: 10px; color: var(--text-3); }
  .stat-box .v2 { font-family: var(--font-mono); font-size: 12px; font-weight: 650; margin-top: 3px; color: var(--text-1); }

  .goal { display: flex; align-items: center; gap: 9px; padding: 6.5px 0; font-size: 12px; border-bottom: 1px dashed var(--stroke); }
  .goal:last-child { border: none; }
  .goal.done { color: var(--text-3); text-decoration: line-through; }
  .goal .st { margin-left: auto; font-size: 10px; font-family: var(--font-mono); }

  /* 攻略胶囊 */
  .guide-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .g-pill {
    font-size: 11px; padding: 3px 10px; border-radius: 980px; border: 1px solid var(--stroke);
    background: var(--inset); color: var(--text-2); cursor: pointer;
  }
  .g-pill.on { border-color: var(--green-line); background: var(--green-dim); color: var(--green); font-weight: 600; }
  .guide-txt { font-size: 11.5px; color: var(--text-2); line-height: 1.7; background: var(--inset); border: 1px solid var(--stroke); border-radius: var(--r-md); padding: 9px 11px; }

  /* 回执时间线（纯语义色） */
  .filter-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
  .f-btn { font-size: 10.5px; padding: 3px 9px; border-radius: 980px; border: 1px solid var(--stroke); background: var(--inset); color: var(--text-2); cursor: pointer; }
  .f-btn.on { border-color: var(--blue-line); background: var(--blue-dim); color: var(--blue); font-weight: 600; }
  .r-list { display: flex; flex-direction: column; gap: 8px; }
  .r-item { border-left: 2.5px solid var(--stroke-2); padding: 4px 0 4px 11px; }
  .r-item.ok { border-color: var(--green); }
  .r-item.unc { border-color: var(--amber); }
  .r-item.fail { border-color: var(--red); }
  .r-head { display: flex; align-items: center; gap: 7px; font-size: 11.5px; }
  .r-st { font-family: var(--font-mono); font-size: 10px; font-weight: 650; }
  .r-item.ok .r-st { color: var(--green); }
  .r-item.unc .r-st { color: var(--amber); }
  .r-item.fail .r-st { color: var(--red); }
  .r-dt { font-size: 11px; color: var(--text-3); margin-top: 2px; line-height: 1.55; }

  /* 快捷指令 */
  .cmd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .cmd-btn {
    padding: 8px 10px; border-radius: var(--r-md); border: 1px solid var(--stroke);
    background: var(--inset); color: var(--text-1); font-size: 12px; font-weight: 550;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: all var(--dur-hover) var(--ease);
  }
  .cmd-btn:hover { border-color: var(--blue-line); background: var(--blue-dim); color: var(--blue); }

  /* 折叠式高级诊断（把技术细节收起来，保持主界面清爽） */
  details.diag { border-radius: var(--r-xl); }
  details.diag summary {
    list-style: none; cursor: pointer; padding: 13px 16px; font-size: 12px; font-weight: 600;
    color: var(--text-2); display: flex; align-items: center; justify-content: space-between;
  }
  details.diag summary::-webkit-details-marker { display: none; }
  .diag-body { padding: 0 16px 14px; border-top: 1px dashed var(--stroke); padding-top: 10px; font-size: 11.5px; color: var(--text-2); }
  .kv { display: flex; justify-content: space-between; padding: 4px 0; }
  .kv b { font-family: var(--font-mono); color: var(--text-1); font-size: 11px; }

  /* Mod 管理子视图 */
  .mod-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--stroke); }
  .mod-row:last-child { border-bottom: none; }

  @media (max-width: 1040px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body data-wb-page="stardew" data-wb-group="游戏与直播" data-wb-title="游戏共玩">
  <main class="wb-main">
    <div class="page">
      <!-- 顶部统一游戏切换条（替代侧栏 4 个割裂入口） -->
      <div class="game-head">
        <div class="game-head-left">
          <div class="seg-tabs" role="tablist">
            <button class="seg-tab on" data-gtab="stardew" onclick="switchGame('stardew')"><i data-lucide="sprout" class="xs"></i>星露谷物语</button>
            <button class="seg-tab" data-gtab="terraria" onclick="switchGame('terraria')"><i data-lucide="swords" class="xs"></i>泰拉瑞亚</button>
            <button class="seg-tab" data-gtab="dst" onclick="switchGame('dst')"><i data-lucide="flame" class="xs"></i>饥荒：联机版</button>
          </div>
          <div class="sub-tabs" id="stardew-subtabs">
            <button class="sub-tab on" data-sub="monitor" onclick="switchSub('monitor')">共玩监控</button>
            <button class="sub-tab" data-sub="mods" onclick="switchSub('mods')">Mod 管理 (3)</button>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <button class="btn-pill ghost" id="sim-conn-btn" onclick="toggleSimConn()"><i data-lucide="wifi" class="xs"></i>预览未连接引导态</button>
        </div>
      </div>

      <!-- 连接状态与开箱引导条 -->
      <div class="conn-banner ok" id="conn-banner"></div>

      <!-- 视图 A：统一三游戏共玩监控 -->
      <div id="view-monitor" class="wrap">
        <div class="col stagger" id="col-left"></div>
        <div class="col stagger" id="col-mid"></div>
        <div class="col stagger" id="col-right"></div>
      </div>

      <!-- 视图 B：星露谷 Mod 管理（收拢为星露谷二级 Tab） -->
      <div id="view-mods" style="display:none">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
          <div style="font-size:12px;color:var(--text-2)">SMAPI 目录：<span class="mono">~/Library/Application Support/Steam/.../Mods</span></div>
          <div style="display:flex;gap:8px">
            <button class="btn-pill ghost" onclick="wbToast('已打开本地 Mods 文件夹')"><i data-lucide="folder-open" class="xs"></i>打开目录</button>
            <button class="btn-pill primary" onclick="wbToast('请选择 .zip 格式的 SMAPI Mod 压缩包')"><i data-lucide="upload" class="xs"></i>安装 ZIP Mod</button>
          </div>
        </div>
        <div class="card" style="overflow:hidden" id="mods-list"></div>
      </div>
    </div>
  </main>

<script>

      connectedHint: '泰拉瑞亚已连接 · 森林地表（第 1 天 15:20）· 模组生存反射已开启',
      offlineTitle: '等待连接到《泰拉瑞亚》',

      ],
      cmds: [['去挖矿', 'mine'], ['跳跃脱困', 'jump'], ['喝血药', 'drink_potion'], ['紧急撤退', 'flee'], ['插火把', 'torch'], ['原地守夜', 'wait']],
      diag: [['桥接方式', 'tModLoader 模组 (:18090)'], ['可用动作', '32 个白名单动作'], ['玩家接管', '按 F8 键 100ms 内释放控制权'], ['生存反射', '模组侧帧级岩浆/低血保护']],
    },
    dst: {
      name: '饥荒：联机版',
      connectedHint: '饥荒：联机版已连接 · 第 1 天 黄昏（秋）· 本地专用服同步正常',
      offlineTitle: '等待连接到《饥荒：联机版》',
      offlineSteps: '1. 在 Klei 官网生成 cluster_token.txt 放入本地集群目录； 2. 点击右侧「启动本地服」并用客户端加入本机房间。',
      action: { name: 'build_campfire', source: '智能决策', desc: '黄昏临近，在浆果丛旁生起营火并备好树枝防查理袭击。', pct: 74 },
      stats: [['昼夜 / 季节', '第 1 天 · 黄昏(秋)'], ['血 / 饿 / 理智', '150 / 118 / 185'], ['位置', '桦树林边缘']],
      goals: [

      ],

      guides: {

        理智与猎犬: '理智偏低时顺手采花做花环；听到猎犬吠叫优先就近找牛群或切武器应对。',
      },
      receipts: [
        { st: 'ok', label: '完成', time: '白天 30%', tool: 'gather(flint)', dt: '采集燧石 ×4、树枝 ×8、干草 ×10' },
        { st: 'ok', label: '完成', time: '白天 75%', tool: 'craft(axe)', dt: '合成斧头并砍伐 3 棵常青树' },
        { st: 'ok', label: '完成', time: '黄昏 10%', tool: 'build_campfire', dt: '营火已点燃，自动进入夜间添柴看护' },
      ],
      cmds: [['采集资源', 'gather'], ['生起营火', 'campfire'], ['火堆添柴', 'add_fuel'], ['吃背包食物', 'eat'], ['采花回理智', 'pick_flower'], ['准备战斗', 'combat']],
      diag: [['桥接方式', 'Lua 权威模组 + 本地桥 (:18100)'], ['同步节拍', '2s 状态 tick + 0.25s 动作层'], ['可用动作', '30 个白名单动作'], ['接管机制', '客户端操作自动暂停托管']],
    },
  };

  const MODS = [
    { name: '大肥鱼种白饭（Blind Whale Farmer）', ver: '1.1.27', desc: '星露谷自动驾驶核心桥接模组', on: true },
    { name: 'Console Commands', ver: '4.5.2', desc: 'SMAPI 内置控制台工具', on: true },
    { name: 'Save Backup', ver: '4.5.2', desc: '启动时自动备份农场存档', on: true },
  ];

  let curGame = 'stardew';
  let curSub = 'monitor';
  let simConnected = true;
  let receiptFilter = 'all';
  let activeGuideKey = '';

  function switchGame(gid) {
    curGame = gid;
    curSub = 'monitor';
    receiptFilter = 'all';
    activeGuideKey = Object.keys(GAME_DATA[gid].guides)[0];
    window.wbState?.patch({ activeGame: gid });
    renderAll();
  }
  function switchSub(sub) {
    curSub = sub;
    renderAll();
  }
  function toggleSimConn() {
    simConnected = !simConnected;
    renderAll();
  }

  function renderAll() {
    const g = GAME_DATA[curGame];
    if (!activeGuideKey || !g.guides[activeGuideKey]) activeGuideKey = Object.keys(g.guides)[0];

    document.querySelectorAll('[data-gtab]').forEach((b) => b.classList.toggle('on', b.dataset.gtab === curGame));
    document.getElementById('stardew-subtabs').style.display = curGame === 'stardew' ? 'inline-flex' : 'none';
    document.querySelectorAll('[data-sub]').forEach((b) => b.classList.toggle('on', b.dataset.sub === curSub));
    document.getElementById('sim-conn-btn').innerHTML = `<i data-lucide="${simConnected ? 'wifi-off' : 'wifi'}" class="xs"></i>${simConnected ? '预览未连接引导态' : '恢复已连接态'}`;

    const banner = document.getElementById('conn-banner');
    if (simConnected) {
      banner.className = 'conn-banner ok';
      banner.innerHTML = `
        <div style="flex:1"><div class="title" style="color:var(--green)"><span class="pulse-dot"></span>${g.connectedHint}</div></div>
        <button class="btn-pill ghost" onclick="wbToast('已重新探测《${g.name}》状态：连接正常')"><i data-lucide="refresh-cw" class="xs"></i>刷新状态</button>`;
    } else {
      banner.className = 'conn-banner';
      banner.innerHTML = `
        <div style="flex:1">
          <div class="title" style="color:var(--amber)"><i data-lucide="plug-zap" class="sm"></i>${g.offlineTitle}</div>
          <div class="steps">${g.offlineSteps}</div>
        </div>
        <button class="btn-pill primary" onclick="toggleSimConn()"><i data-lucide="refresh-cw" class="xs"></i>重新探测连接</button>`;
    }

    document.getElementById('view-monitor').style.display = curSub === 'monitor' ? 'grid' : 'none';
    document.getElementById('view-mods').style.display = curSub === 'mods' ? 'block' : 'none';

    if (curSub === 'mods') {
      document.getElementById('mods-list').innerHTML = MODS.map((m, i) => `
        <div class="mod-row">
          <div style="flex:1">
            <div style="font-size:13px;font-weight:650">${m.name} <span class="pill" style="font-size:10px;margin-left:6px">v${m.ver}</span></div>
            <div style="font-size:11.5px;color:var(--text-3);margin-top:3px">${m.desc}</div>
          </div>
          <div class="sw${m.on ? ' on' : ''}" onclick="MODS[${i}].on=!MODS[${i}].on;renderAll();wbToast('${m.name} 已'+(MODS[${i}].on?'启用':'停用'))"></div>
        </div>`).join('');
      lucide.createIcons();
      return;
    }

    // 左栏：当前动作 + 目标链 + 攻略
    document.getElementById('col-left').innerHTML = `
      <div class="card panel">
        <div class="now-top">
          <span>当前执行动作</span>
          <span class="pill ${simConnected ? 'pill-blue' : ''}">${simConnected ? g.action.source : '待连接'}</span>
        </div>
        <div class="now-name">${simConnected ? g.action.name : '等待游戏接入'}</div>
        <div class="now-desc">${simConnected ? g.action.desc : '完成上方启动指引并连接后，这里会实时显示角色正在进行的动作与进度。'}</div>
        <div class="now-bar"><i style="width:${simConnected ? g.action.pct : 0}%"></i></div>
        <div class="stat-grid">
          ${g.stats.map(([k, v]) => `<div class="stat-box"><div class="k2">${k}</div><div class="v2">${simConnected ? v : '—'}</div></div>`).join('')}
        </div>
      </div>

      <div class="card panel">
        <h4><i data-lucide="list-todo" class="sm" style="color:var(--blue)"></i>当前目标链</h4>
        ${g.goals.map(([txt, st, done]) => `
          <div class="goal${done ? ' done' : ''}">
            <i data-lucide="${done ? 'check-circle-2' : 'circle-dot'}" class="xs" style="color:${done ? 'var(--green)' : 'var(--blue)'}"></i>
            <span>${txt}</span>
            <span class="st" style="color:${done ? 'var(--green)' : 'var(--text-3)'}">${st}</span>
          </div>`).join('')}
      </div>

      <div class="card panel">
        <h4><i data-lucide="book-open" class="sm" style="color:var(--green)"></i>${g.guideTitle}</h4>
        <div class="guide-pills">
          ${Object.keys(g.guides).map((k) => `<button class="g-pill${k === activeGuideKey ? ' on' : ''}" onclick="activeGuideKey='${k}';renderAll()">${k}</button>`).join('')}
        </div>
        <div class="guide-txt">${g.guides[activeGuideKey]}</div>
      </div>
    `;

    // 中栏：回执时间线（全语义色）
    const filteredR = g.receipts.filter((r) => receiptFilter === 'all' || r.st === receiptFilter);
    document.getElementById('col-mid').innerHTML = `
      <div class="card panel">
        <h4><i data-lucide="history" class="sm" style="color:var(--blue)"></i>执行记录与回执</h4>
        <div class="filter-row">
          ${[['all', '全部'], ['ok', '完成'], ['unc', '不确定'], ['fail', '失败']].map(([k, lbl]) =>
            `<button class="f-btn${receiptFilter === k ? ' on' : ''}" onclick="receiptFilter='${k}';renderAll()">${lbl}</button>`
          ).join('')}
        </div>
        <div class="r-list">
          ${simConnected ? filteredR.map((r) => `
            <div class="r-item ${r.st}">
              <div class="r-head">
                <span class="r-st">${r.label}</span>
                <b class="mono" style="font-size:11.5px">${r.tool}</b>
                <span class="mono k" style="margin-left:auto;font-size:10px">${r.time}</span>
              </div>
              <div class="r-dt">${r.dt}</div>
            </div>`).join('') : '<div style="padding:18px 0;text-align:center;color:var(--text-3);font-size:12px">游戏连接后，这里会按时间线记录每一步动作与结果。</div>'}
        </div>
      </div>
    `;

    // 右栏：快捷指令 + 折叠式高级诊断
    document.getElementById('col-right').innerHTML = `
      <div class="card panel">
        <h4><i data-lucide="zap" class="sm" style="color:var(--amber)"></i>主人快捷插队</h4>
        <div class="cmd-grid">
          ${g.cmds.map(([lbl, tool]) => `<button class="cmd-btn" onclick="wbToast('已向《${g.name}》插队指令：${lbl} (${tool})')">${lbl}</button>`).join('')}
        </div>
        <button class="btn-pill red" style="width:100%;margin-top:10px" onclick="wbToast('已发送中止指令：停下当前动作')">
          <i data-lucide="square" class="xs"></i>立即停下当前动作
        </button>
      </div>

      <details class="card diag">
        <summary>
          <span style="display:flex;align-items:center;gap:7px"><i data-lucide="wrench" class="xs" style="color:var(--text-3)"></i>高级诊断与连接参数</span>
          <i data-lucide="chevron-down" class="xs"></i>
        </summary>
        <div class="diag-body">
          ${g.diag.map(([k, v]) => `<div class="kv"><span class="k">${k}</span><b>${v}</b></div>`).join('')}
        </div>
      </details>
    `;

    lucide.createIcons();
  }

  window.addEventListener('wb:state', (e) => {
    const gid = e.detail?.activeGame;
    if (gid && gid !== curGame && GAME_DATA[gid]) {
      curGame = gid;
      curSub = 'monitor';
      activeGuideKey = Object.keys(GAME_DATA[gid].guides)[0];
      renderAll();
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    const st = window.wbState?.get?.();
    if (st?.activeGame && GAME_DATA[st.activeGame]) curGame = st.activeGame;
    renderAll();
  });
</script>
</body>
</html>
