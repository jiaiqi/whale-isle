<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<title>桌宠素材预览工坊 — 鲸屿 Whale Isle</title>
<link rel="stylesheet" href="tokens.css">
<script src="vendor/lucide.min.js"></script>
<script src="shell.js"></script>
<style>
  .page { height: 100%; display: flex; flex-direction: column; overflow: hidden; }

  /* 顶部来源切换 + 角色横向条（复刻 aboutme-pets 顶部栏并融合 CrossPet 皮肤/彩蛋） */
  .top-strip {
    padding: 10px 20px; border-bottom: 1px solid var(--stroke);
    background: color-mix(in srgb, var(--bg-elev) 48%, transparent);
    display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
  }
  .strip-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .src-seg {
    display: inline-flex; padding: 2px; border-radius: 980px;
    background: var(--inset); border: 1px solid var(--stroke);
  }
  .src-seg button {
    border: none; background: transparent; color: var(--text-2); font-size: 11.5px; font-weight: 600;
    padding: 4px 12px; border-radius: 980px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    transition: all var(--dur-hover) var(--ease);
  }
  .src-seg button.on { background: var(--blue-dim); color: var(--blue); }

  .pet-pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; flex: 1; }
  .pet-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 980px;
    border: 1px solid var(--stroke); background: var(--surface); color: var(--text-2);
    font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: all var(--dur-hover) var(--ease);
  }
  .pet-pill:hover { border-color: var(--blue-line); color: var(--text-1); }
  .pet-pill.on { border-color: var(--blue-line); background: var(--blue-dim); color: var(--blue); }
  .pet-pill .cnt { font-family: var(--font-mono); font-size: 10px; opacity: .75; }

  /* 主体双栏：左 640×360 实时播放器，右 分类与检索列表（1:1 对标 aboutme-pets） */
  .studio-grid {
    flex: 1; min-height: 0; display: grid;
    grid-template-columns: minmax(460px, 1.12fr) 1fr; overflow: hidden;
  }

  /* 左栏：播放器区 */
  .player-col {
    border-right: 1px solid var(--stroke); padding: 16px 20px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px;
  }
  .canvas-stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: var(--r-xl);
    border: 1px solid var(--stroke-2); overflow: hidden;
    background-image:
      linear-gradient(45deg, color-mix(in srgb, var(--text-1) 5%, transparent) 25%, transparent 25%),
      linear-gradient(-45deg, color-mix(in srgb, var(--text-1) 5%, transparent) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, color-mix(in srgb, var(--text-1) 5%, transparent) 75%),
      linear-gradient(-45deg, transparent 75%, color-mix(in srgb, var(--text-1) 5%, transparent) 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    background-color: var(--inset);
    display: flex; align-items: center; justify-content: center;
  }
  .canvas-stage canvas { width: 100%; height: 100%; display: block; }
  .stage-hud-tl {
    position: absolute; top: 10px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap;
  }
  .stage-hud-tr {
    position: absolute; top: 10px; right: 12px; display: flex; gap: 6px;
  }

  /* 播放控制栏（空格暂停、←/→逐帧、↑/↓换动作、滑杆拖动） */
  .ctrl-card { padding: 12px 14px; border-radius: var(--r-lg); display: flex; flex-direction: column; gap: 10px; }
  .ctrl-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ctrl-btn {
    height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--stroke);
    background: var(--inset); color: var(--text-1); font-size: 11.5px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    transition: all var(--dur-hover) var(--ease);
  }
  .ctrl-btn:hover { border-color: var(--blue-line); color: var(--blue); background: var(--blue-dim); }
  .ctrl-btn.primary { border-color: var(--blue-line); background: var(--blue); color: #fff; }
  .scrub-row { display: flex; align-items: center; gap: 10px; font-size: 11px; font-family: var(--font-mono); color: var(--text-2); }
  .scrub-row input[type=range] { flex: 1; }
  .meta-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .meta-box { padding: 8px 10px; border-radius: var(--r-md); background: var(--inset); border: 1px solid var(--stroke); }
  .meta-box span { display: block; font-size: 10px; color: var(--text-3); }
  .meta-box b { font-size: 12px; font-family: var(--font-mono); color: var(--text-1); }

  /* 右栏：分类过滤 + 搜索 + 动作网格 */
  .browser-col {
    padding: 14px 18px; display: flex; flex-direction: column; min-height: 0;
    background: color-mix(in srgb, var(--bg-elev) 24%, transparent);
  }
  .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .search-inp {
    flex: 1; display: flex; align-items: center; gap: 7px; padding: 7px 12px;
    border-radius: 980px; border: 1px solid var(--stroke-2); background: var(--surface);
  }
  .search-inp input { flex: 1; border: none; background: transparent; color: var(--text-1); font-size: 12.5px; outline: none; }
  .cat-bar { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
  .cat-pill {
    font-size: 11px; padding: 3.5px 9px; border-radius: 980px; border: 1px solid var(--stroke);
    background: var(--surface); color: var(--text-2); cursor: pointer;
  }
  .cat-pill.on { border-color: var(--blue-line); background: var(--blue-dim); color: var(--blue); font-weight: 600; }

  .act-list {
    flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px; align-content: start; padding-right: 4px;
  }
  .act-item {
    padding: 10px 11px; border-radius: var(--r-md); border: 1px solid var(--stroke);
    background: var(--surface); cursor: pointer; display: flex; flex-direction: column; gap: 5px;
    transition: all var(--dur-hover) var(--ease);
  }
  .act-item:hover { border-color: var(--blue-line); }
  .act-item.on { border-color: var(--blue-line); background: var(--blue-dim); box-shadow: var(--glow-blue); }
  .act-nm { font-size: 12px; font-weight: 650; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .act-sub { font-size: 10.5px; color: var(--text-3); font-family: var(--font-mono); display: flex; align-items: center; gap: 6px; }

  .kbd-hint { font-size: 10.5px; color: var(--text-3); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--stroke); }
  .kbd-hint kbd { padding: 1px 5px; border-radius: 4px; border: 1px solid var(--stroke-2); background: var(--inset); font-family: var(--font-mono); font-size: 10px; color: var(--text-2); }

  @media (max-width: 1020px) { .studio-grid { grid-template-columns: 1fr; overflow-y: auto; } .player-col { border: none; } }
</style>
</head>
<body data-wb-page="preview" data-wb-group="声形与舞台" data-wb-title="素材预览工坊">
  <main class="wb-main page">
    <!-- 顶部来源与角色切换条 -->
    <div class="top-strip">
      <div class="strip-row">

        <div style="margin-left:auto;display:flex;gap:7px">

          <button class="btn-pill primary" style="font-size:11.5px;padding:5px 11px" onclick="applyToPet()"><i data-lucide="send" class="xs"></i>设为桌宠 / 立即试播</button>
        </div>
      </div>
      <div class="pet-pills" id="pet-pills"></div>
    </div>

    <div class="studio-grid">
      <!-- 左侧：640×360 12fps 实时播放器 -->

        <div class="card ctrl-card">
          <div class="ctrl-row">
            <button class="ctrl-btn primary" id="btn-play" onclick="togglePlay()"><i data-lucide="pause" class="xs"></i><span>暂停</span></button>
            <button class="ctrl-btn" onclick="stepFrame(-1)" title="上一帧 (←)"><i data-lucide="skip-back" class="xs"></i>上一帧</button>
            <button class="ctrl-btn" onclick="stepFrame(1)" title="下一帧 (→)"><i data-lucide="skip-forward" class="xs"></i>下一帧</button>
            <button class="ctrl-btn" onclick="moveAction(-1)" title="上一个动作 (↑)"><i data-lucide="arrow-up" class="xs"></i>上一动作</button>
            <button class="ctrl-btn" onclick="moveAction(1)" title="下一个动作 (↓)"><i data-lucide="arrow-down" class="xs"></i>下一动作</button>
            <div style="margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-2)">
              <span>原声音效</span>
              <div class="sw on" id="sw-audio" onclick="toggleAudio()"></div>
            </div>
          </div>

          <div class="scrub-row">
            <span id="frame-cur">01 / 48</span>
            <input type="range" id="frame-slider" min="0" max="47" value="0" oninput="scrubFrame(this.value)">
            <span id="time-cur">0.00s / 4.00s</span>
          </div>

          <div class="meta-grid">
            <div class="meta-box"><span>当前动作 ID</span><b id="m-id">举奖杯得意</b></div>
            <div class="meta-box"><span>画布 / 网格</span><b id="m-grid">640×360 · 8×6</b></div>
            <div class="meta-box"><span>语义槽位映射</span><b id="m-slot">happy_maid</b></div>
            <div class="meta-box"><span>原声音轨 / 声线</span><b id="m-voice">m4a + 傲娇大小姐</b></div>
          </div>
        </div>

        <div class="card" style="padding:12px 14px;border-radius:var(--r-lg)">
          <div style="font-size:12px;font-weight:650;margin-bottom:5px;display:flex;align-items:center;gap:6px">
            <i data-lucide="message-square-quote" class="xs" style="color:var(--violet)"></i>
            关联台词与桌面交互映射（来自 CrossPet + dsh-pet）
          </div>
          <div style="font-size:11.5px;color:var(--text-2);line-height:1.65" id="line-preview">
            台词池：「就这？轻松！」「本小姐效率全队第一，记在小本子里！」 · 对应场景：大活完成（≥8 次工具）/ 星露谷钓鱼或采矿高光回执。
          </div>
        </div>
      </section>

      <!-- 右侧：分类筛选 + 搜索 + 全量动作列表 -->
      <aside class="browser-col">
        <div class="search-row">
          <div class="search-inp">
            <i data-lucide="search" class="xs" style="color:var(--text-3)"></i>
            <input id="act-search" placeholder="搜索动作名、分类、语义槽位或 CrossPet 彩蛋…" oninput="renderActions()">
          </div>
          <span class="pill mono" id="act-count" style="align-self:center">106 项</span>
        </div>

        <div class="cat-bar" id="cat-bar"></div>
        <div class="act-list" id="act-list"></div>

        <div class="kbd-hint">
          <span><kbd>Space</kbd> 播放/暂停</span>
          <span><kbd>←</kbd><kbd>→</kbd> 逐帧步进</span>
          <span><kbd>↑</kbd><kbd>↓</kbd> 切换动作</span>
          <span>支持音频随帧 seek 与一键推送到桌宠窗口试播</span>
        </div>
      </aside>
    </div>
  </main>

      { id: 'gpt-onesie', name: '小智 · 降智龙崽连体服', total: 53, audio: 0, voice: '倔强朋友(+2)', color: '#30d158', cats: ['全部', '皮肤立绘'], actions: [

    ],
    'crosspet-eggs': [
      { id: 'egg-deepseek', name: 'GLM 上门晒成绩单', total: 5, audio: 0, voice: '清脆少女(-2)', color: '#0a84ff', cats: ['全部', '随机串门彩蛋'], actions: [

        { id: 'pretend · 偷看图纸', cat: '随机串门彩蛋', frames: 24, slot: 'ambient', audio: false, line: '我才没有抄，是致敬～' },
        { id: 'caught · 被主人点破', cat: '随机串门彩蛋', frames: 24, slot: 'clumsy_panic', audio: false, line: '诶嘿～只、只是参考一下！' },
      ]},
      { id: 'egg-grok', name: '小鲸偷戴王冠冒充 Grok', total: 6, audio: 0, voice: '俏皮萌妹', color: '#ff9f0a', cats: ['全部', '随机串门彩蛋'], actions: [
        { id: '拿反手机装酷', cat: '随机串门彩蛋', frames: 24, slot: 'ambient', audio: false, line: '哼，现在由本 Grok 接管！（手机拿反了）' },
      ]},
      { id: 'egg-kimi', name: '小鲸举纸板月亮冒充 Kimi', total: 6, audio: 0, voice: '俏皮萌妹', color: '#64d2ff', cats: ['全部', '随机串门彩蛋'], actions: [
        { id: '尾巴藏不住拉提琴', cat: '随机串门彩蛋', frames: 24, slot: 'ambient', audio: false, line: '我是月亮上来的女仆！（鲸鱼尾巴还在晃）' },
      ]},
      { id: 'egg-gemini-yarn', name: '猫猫勾毛衣线头', total: 6, audio: 0, voice: '嗲嗲学妹', color: '#bf5af2', cats: ['全部', '皮肤联动彩蛋'], actions: [
        { id: '把自己缠成毛线团', cat: '皮肤联动彩蛋', frames: 24, slot: 'clumsy_panic', audio: false, line: '喵呜！织毛衣把自己缠住啦！' },
      ]},
      { id: 'egg-all-14', name: '其余 10 套彩蛋（Claude/GPT/Qwen/睡衣/帽子等）', total: 56, audio: 0, voice: '随角色', color: '#30d158', cats: ['全部', '随机串门彩蛋'], actions: [
        { id: 'egg-claude-pajamas · 圣女偷穿睡衣', cat: '随机串门彩蛋', frames: 24, slot: 'ambient', audio: false, line: '就体验一晚无忧无虑的日子……' },
        { id: 'egg-deepseek-hat · 借魔术帽变白饭', cat: '随机串门彩蛋', frames: 24, slot: 'eat_rice', audio: false, line: '帽子里变出一大碗白米饭！' },
      ]},
    ],
  };

  let activeSource = 'aboutme';
  let activePet = CATALOG.aboutme[0];
  let activeCat = '全部';
  let activeAction = activePet.actions[1];
  let playing = true;
  let audioOn = true;
  let frame = 0;
  let fps = 12;
  let lastTick = 0;

  function switchSource(src) {
    activeSource = src;
    document.querySelectorAll('#src-seg button').forEach((b) => b.classList.toggle('on', b.dataset.src === src));
    activePet = CATALOG[src][0];
    activeCat = '全部';
    activeAction = activePet.actions[0];
    frame = 0;
    renderPets();
    renderCats();
    renderActions();
    syncMeta();
  }

  function renderPets() {
    document.getElementById('pet-pills').innerHTML = CATALOG[activeSource].map((p) => `
      <button class="pet-pill${p.id === activePet.id ? ' on' : ''}" onclick="selectPet('${p.id}')">
        <span>${p.name}</span>
        <span class="cnt">${p.total}</span>
      </button>`).join('');
  }

  function selectPet(id) {
    activePet = CATALOG[activeSource].find((p) => p.id === id) || CATALOG[activeSource][0];
    activeCat = '全部';
    activeAction = activePet.actions[0];
    frame = 0;
    renderPets();
    renderCats();
    renderActions();
    syncMeta();
  }

  function renderCats() {
    document.getElementById('cat-bar').innerHTML = activePet.cats.map((c) => `
      <button class="cat-pill${c === activeCat ? ' on' : ''}" onclick="selectCat('${c}')">${c}</button>`).join('');
  }

  function selectCat(c) {
    activeCat = c;
    renderCats();
    renderActions();
  }

  function filteredActions() {
    const kw = (document.getElementById('act-search')?.value || '').trim().toLowerCase();
    return activePet.actions.filter((a) => {
      if (activeCat !== '全部' && a.cat !== activeCat) return false;
      if (!kw) return true;
      return a.id.toLowerCase().includes(kw) || a.cat.toLowerCase().includes(kw) || a.slot.toLowerCase().includes(kw) || a.line.toLowerCase().includes(kw);
    });
  }

  function renderActions() {
    const list = filteredActions();
    document.getElementById('act-count').textContent = `${list.length} / ${activePet.total} 项`;
    document.getElementById('act-list').innerHTML = list.map((a) => `
      <div class="act-item${a.id === activeAction.id ? ' on' : ''}" onclick="selectAction('${a.id}')">
        <div class="act-nm">
          <span>${a.id}</span>
          ${a.audio ? '<i data-lucide="volume-2" class="xs" style="color:var(--violet)"></i>' : ''}
        </div>
        <div class="act-sub">
          <span>${a.cat}</span><span>·</span><span>${a.slot}</span><span>·</span><span>${a.frames} 帧</span>
        </div>
      </div>`).join('') || '<div style="grid-column:1/-1;padding:24px;text-align:center;color:var(--text-3);font-size:12px">没有匹配的动作或彩蛋</div>';
    lucide.createIcons();
  }

  function selectAction(id) {
    const found = activePet.actions.find((a) => a.id === id);
    if (!found) return;
    activeAction = found;
    frame = 0;
    renderActions();
    syncMeta();
  }

  function syncMeta() {
    document.getElementById('hud-pet').textContent = `${activePet.name} · ${activePet.id}`;
    document.getElementById('hud-cat').textContent = activeAction.cat;
    document.getElementById('hud-audio').textContent = activeAction.audio ? (audioOn ? 'AAC 原声音轨同步中' : '原声音轨已静音') : '纯视觉动作';
    document.getElementById('m-id').textContent = activeAction.id;
    document.getElementById('m-grid').textContent = `640×360 · 8×${Math.ceil(activeAction.frames / 8)}`;
    document.getElementById('m-slot').textContent = activeAction.slot;
    document.getElementById('m-voice').textContent = `${activeAction.audio ? 'm4a + ' : ''}${activePet.voice}`;
    document.getElementById('line-preview').textContent = `专属台词：「${activeAction.line}」 · 绑定槽位：${activeAction.slot} · 角色声线：${activePet.voice}`;
    const slider = document.getElementById('frame-slider');
    slider.max = String(Math.max(1, activeAction.frames - 1));
    slider.value = String(frame);
    updateFrameLabel();
  }

  function updateFrameLabel() {
    const total = activeAction.frames;
    document.getElementById('frame-cur').textContent = `${String(frame + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}`;
    document.getElementById('time-cur').textContent = `${(frame / fps).toFixed(2)}s / ${(total / fps).toFixed(2)}s`;
    document.getElementById('frame-slider').value = String(frame);
  }

  function togglePlay() {
    playing = !playing;
    document.getElementById('btn-play').innerHTML = playing
      ? '<i data-lucide="pause" class="xs"></i><span>暂停</span>'
      : '<i data-lucide="play" class="xs"></i><span>播放</span>';
    lucide.createIcons();
  }
  function stepFrame(delta) {
    playing = false;
    document.getElementById('btn-play').innerHTML = '<i data-lucide="play" class="xs"></i><span>播放</span>';
    lucide.createIcons();
    frame = (frame + delta + activeAction.frames) % activeAction.frames;
    updateFrameLabel();
    drawCanvas();
  }
  function scrubFrame(val) {
    frame = Number(val) || 0;
    updateFrameLabel();
    drawCanvas();
  }
  function moveAction(delta) {
    const list = filteredActions();
    if (!list.length) return;
    const idx = list.findIndex((a) => a.id === activeAction.id);
    const next = list[(idx + delta + list.length) % list.length];
    selectAction(next.id);
  }
  function toggleAudio() {
    audioOn = !audioOn;
    document.getElementById('sw-audio').classList.toggle('on', audioOn);
    syncMeta();
  }
  function applyToPet() {
    wbToast(`已向桌宠窗口推送：${activePet.name} → ${activeAction.id}（${activeAction.slot}）`);
  }

  /* 640×360 精灵图动画模拟绘制（展示脚底基准线、Q 弹节奏与逐帧进度） */
  function drawCanvas() {
    const cv = document.getElementById('preview-canvas');
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, 640, 360);
    const t = (frame / Math.max(1, activeAction.frames)) * Math.PI * 2;
    const bounce = Math.sin(t * 2) * 10;
    const sqX = 1 + Math.sin(t * 2) * 0.04;
    const sqY = 1 - Math.sin(t * 2) * 0.04;

    // 脚底基准线（0.92）
    ctx.strokeStyle = 'rgba(10,132,255,0.32)';
    ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(40, 330); ctx.lineTo(600, 330); ctx.stroke();
    ctx.setLineDash([]);

    // 投影
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(320, 326, 78 * sqX, 11, 0, 0, Math.PI * 2); ctx.fill();

    // 角色剪影占位动画
    ctx.save();
    ctx.translate(320, 215 + bounce);
    ctx.scale(sqX, sqY);
    const col = activePet.color || '#0a84ff';
    ctx.fillStyle = col + '33';
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(-86, -86, 172, 172, 34);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#f5f5f7';
    ctx.font = '700 22px -apple-system, PingFang SC, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(activePet.name.split(' · ')[0], 0, -10);
    ctx.font = '500 13px -apple-system, PingFang SC, sans-serif';
    ctx.fillStyle = '#d1d1d6';
    ctx.fillText(activeAction.id, 0, 18);
    ctx.font = '600 11px ui-monospace, monospace';
    ctx.fillStyle = col;
    ctx.fillText(`FRAME ${String(frame + 1).padStart(2, '0')} / ${activeAction.frames}`, 0, 44);
    ctx.restore();
  }

  function loop(ts) {
    if (playing && ts - lastTick >= 1000 / fps) {
      lastTick = ts;
      frame = (frame + 1) % Math.max(1, activeAction.frames);
      updateFrameLabel();
      drawCanvas();
    }
    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', (e) => {
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stepFrame(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); stepFrame(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveAction(-1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); moveAction(1); }
  });

  document.addEventListener('DOMContentLoaded', () => {
    renderPets();
    renderCats();
    renderActions();
    syncMeta();
    drawCanvas();
    requestAnimationFrame(loop);
  });
</script>
