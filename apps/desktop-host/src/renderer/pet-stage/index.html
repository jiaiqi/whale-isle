<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* T-M6-63：随包上首软糖体（气泡正文）。中文文件名用百分号编码；字体缺失时优雅回退系统字体。 */
      @font-face {
        font-family: 'ShangShouGummy';
        src: url('whale-pet://fonts/%E4%B8%8A%E9%A6%96%E8%BD%AF%E7%B3%96%E4%BD%93.ttf') format('truetype');
        font-display: swap;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: transparent; /* OBS/桌面透明关键 */
        overflow: hidden;
        user-select: none;
      }
      #stage {
        position: absolute;
        transform-origin: bottom center; /* Q 弹以脚底为原点 */
        width: 400px;
        height: 260px;
      }
      #stage video { width: 400px; height: 260px; }
      /* T-M6-48 CrossPet 姿势动效（爱心/蒸汽/星星/音符/zzz/生气） */
      @keyframes poseFloat {
        0% { opacity: 0; transform: translateY(6px) scale(.8); }
        30% { opacity: .95; }
        100% { opacity: 0; transform: translateY(-18px) scale(1.08); }
      }
      /* T-M6-44 省电：暂停非必要毛玻璃/阴影；WebM 源素材 24fps，精灵 canvas 在 JS 侧限 30fps */
      html[data-power-saver="true"] .pet-bubble {
        backdrop-filter: none !important;
        box-shadow: none !important;
      }
      #dev-badge {
        position: fixed;
        left: 4px;
        bottom: 2px;
        font: 10px/1.4 monospace;
        color: rgba(255, 170, 60, 0.85);
        background: rgba(0, 0, 0, 0.35);
        padding: 1px 6px;
        border-radius: 4px;
        display: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="dev-badge"></div>
    <script src="./main.js"></script>
  </body>
</html>
